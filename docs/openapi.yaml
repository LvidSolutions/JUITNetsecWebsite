openapi: 3.1.0
info:
  title: JUIT NetSec Website API
  version: 1.0.0
  description: Public same-origin API used by the JUIT NetSec website.
servers:
  - url: /
paths:
  /api/health:
    get:
      summary: Read deployment health metadata
      operationId: getHealth
      responses:
        '200':
          description: The deployed function is available.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/contact:
    post:
      summary: Submit the public contact form
      operationId: submitContact
      description: >-
        Accepts same-origin JSON requests only. Requests are protected by strict validation,
        distributed rate limiting, a honeypot and server-side Cloudflare Turnstile verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactSubmission'
      responses:
        '202':
          description: The request was accepted. Honeypot submissions intentionally use the same response.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-RateLimit-Remaining:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: The request origin is missing or does not match the deployment origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicError'
        '405':
          description: Only POST is allowed.
          headers:
            Allow:
              schema:
                type: string
                const: POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicError'
        '413':
          description: The JSON request body exceeds 20 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicError'
        '415':
          description: The request does not use application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicError'
        '429':
          description: The current IP or email rate limit has been exceeded.
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicError'
        '502':
          description: The email provider did not accept the delivery request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicError'
        '503':
          description: The contact form is disabled, misconfigured or a protection provider is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicError'
components:
  schemas:
    ContactSubmission:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - message
        - website
        - turnstileToken
        - submissionId
        - formStartedAt
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          maxLength: 254
          format: email
        phone:
          type: string
          maxLength: 40
        message:
          type: string
          minLength: 10
          maxLength: 5000
        website:
          type: string
          maxLength: 200
          description: Hidden honeypot. Human submissions leave this empty.
        turnstileToken:
          type: string
          minLength: 1
          maxLength: 2048
        submissionId:
          type: string
          format: uuid
          description: Client-generated UUID v4 used as the email idempotency key.
        formStartedAt:
          type: number
          description: Unix time in milliseconds when the visible form was opened.
    ContactSuccess:
      type: object
      additionalProperties: false
      required: [ok, requestId]
      properties:
        ok:
          type: boolean
          const: true
        requestId:
          type: string
          format: uuid
    PublicError:
      type: object
      additionalProperties: false
      required: [ok, message]
      properties:
        ok:
          type: boolean
          const: false
        message:
          type: string
    HealthResponse:
      type: object
      additionalProperties: false
      required: [ok, environment, version]
      properties:
        ok:
          type: boolean
          const: true
        environment:
          type: string
        version:
          type: string
  responses:
    BadRequest:
      description: Validation, timing or Turnstile verification failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicError'
