name: CI

on:
  pull_request:
    branches: [merge, staging]
  push:
    branches: [merge, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Reject tracked environment secret files
        shell: bash
        run: |
          tracked_files="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$tracked_files" ]; then
            echo "Tracked environment file(s) found:"
            echo "$tracked_files"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run API and configuration tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Smoke test local production build
        run: npm run smoke:local

  preview-smoke:
    if: github.event_name == 'pull_request'
    needs: test-build-and-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Discover Vercel Preview URL
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          preview_url=""

          for attempt in $(seq 1 36); do
            comments_json="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" 2>/dev/null || true)"
            preview_url="$(
              printf '%s' "$comments_json" \
                | jq -r '.[] | select(.user.login == "vercel[bot]") | .body' \
                | grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' \
                | head -n 1 \
                || true
            )"

            if [ -n "$preview_url" ]; then
              break
            fi

            sleep 5
          done

          if [ -z "$preview_url" ]; then
            echo "No Vercel Preview URL was found in the pull request comments."
            exit 1
          fi

          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "Discovered Vercel Preview: $preview_url"

      - name: Wait for Vercel status on exact commit
        shell: bash
        run: |
          set -euo pipefail
          vercel_state=""
          vercel_target=""

          for attempt in $(seq 1 60); do
            status_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_SHA}/status" 2>/dev/null || true)"
            vercel_state="$(
              printf '%s' "$status_json" \
                | jq -r '[.statuses[]? | select(.context == "Vercel")][0].state // empty' \
                2>/dev/null \
                || true
            )"
            vercel_target="$(
              printf '%s' "$status_json" \
                | jq -r '[.statuses[]? | select(.context == "Vercel")][0].target_url // empty' \
                2>/dev/null \
                || true
            )"

            if [ "$vercel_state" = "success" ]; then
              echo "Vercel reported success for exact commit ${EXPECTED_SHA}."
              break
            fi

            if [ "$vercel_state" = "failure" ] || [ "$vercel_state" = "error" ]; then
              echo "Vercel reported ${vercel_state} for exact commit ${EXPECTED_SHA}."
              echo "Deployment details: ${vercel_target:-unavailable}"
              exit 1
            fi

            sleep 5
          done

          if [ "$vercel_state" != "success" ]; then
            echo "No successful Vercel status was received for exact commit ${EXPECTED_SHA}."
            echo "Last Vercel state: ${vercel_state:-unavailable}"
            echo "Deployment details: ${vercel_target:-unavailable}"
            exit 1
          fi

      - name: Smoke test Vercel routes and security headers
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: npm run smoke:preview
