name: CI

on:
  pull_request:
    branches: [merge, staging]
  push:
    branches: [merge, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Reject tracked environment secret files
        shell: bash
        run: |
          tracked_files="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$tracked_files" ]; then
            echo "Tracked environment file(s) found:"
            echo "$tracked_files"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run API tests
        run: npm test

      - name: Build frontend
        run: npm run build

  preview-smoke:
    if: github.event_name == 'pull_request'
    needs: test-build-and-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Discover Vercel Preview URL
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          preview_url=""

          for attempt in $(seq 1 36); do
            comments_json="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" 2>/dev/null || true)"
            preview_url="$(
              printf '%s' "$comments_json" \
                | jq -r '.[] | select(.user.login == "vercel[bot]") | .body' \
                | grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' \
                | head -n 1 \
                || true
            )"

            if [ -n "$preview_url" ]; then
              break
            fi

            sleep 5
          done

          if [ -z "$preview_url" ]; then
            echo "No Vercel Preview URL was found in the pull request comments."
            exit 1
          fi

          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "Discovered Vercel Preview: $preview_url"

      - name: Wait for exact Preview commit
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          expected_short="${EXPECTED_SHA:0:12}"
          deployed_version=""
          http_status="000"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          for attempt in $(seq 1 24); do
            : > "$response_file"
            http_status="$(
              curl --silent --show-error --location \
                --output "$response_file" \
                --write-out '%{http_code}' \
                --max-time 10 \
                "${PREVIEW_URL}/api/health" \
                || printf '000'
            )"

            if [ "$http_status" = "200" ]; then
              deployed_version="$(jq -r '.version // empty' "$response_file" 2>/dev/null || true)"
              if [ "$deployed_version" = "$expected_short" ]; then
                break
              fi
            fi

            sleep 5
          done

          if [ "$http_status" != "200" ] || [ "$deployed_version" != "$expected_short" ]; then
            echo "Vercel Preview verification failed."
            echo "Expected commit: $expected_short"
            echo "Last HTTP status: $http_status"
            echo "Last reported version: ${deployed_version:-unavailable}"
            echo "Response prefix:"
            head -c 300 "$response_file" | tr '\n' ' '
            echo
            exit 1
          fi

      - name: Smoke test routes and security headers
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail

          for route in / /tjanster /om-oss /kontakt /api/health; do
            status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 15 "${PREVIEW_URL}${route}")"
            if [ "$status" != "200" ]; then
              echo "Unexpected HTTP $status for $route"
              exit 1
            fi
          done

          headers="$(curl --silent --show-error --location --head --max-time 15 "${PREVIEW_URL}/kontakt")"
          printf '%s\n' "$headers" | grep -qi '^x-content-type-options: nosniff'
          printf '%s\n' "$headers" | grep -qi '^x-frame-options: DENY'
          printf '%s\n' "$headers" | grep -qi '^referrer-policy: strict-origin-when-cross-origin'
          printf '%s\n' "$headers" | grep -qi '^permissions-policy:'
